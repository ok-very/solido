[package]
name = "solido"
version = "0.6.0"
edition = "2021"

[features]
default = ["ui-egui"]
ui-egui = []

[dependencies]
eframe = { version = "0.33", features = ["wgpu"] }
egui = "0.33"
egui-wgpu = "0.33"
wgpu = "27"
bytemuck = { version = "1.25", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
log = "0.4"
env_logger = "0.11"
cpal = "0.15"
ringbuf = "0.4"
rand = "0.8"
rand_xoshiro = "0.6"
fundsp = "0.19"
egui-phosphor = { version = "0.11", default-features = false, features = ["regular"] }
hound = "3"
midir = "0.10"
midly = "0.5"
