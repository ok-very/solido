# L-System Generator Schema
# Procedural L-System generation using string rewriting and turtle graphics

[module]
name = "L-System Generator"
version = "1.0.0"
description = "Procedural L-System generation using string rewriting and turtle graphics"
author = "Solido Tri-D"

[parameters.rule_preset]
type = "enum"
default = "tree"
options = ["tree", "bush", "koch_curve", "sierpinski", "dragon_curve"]
description = "Predefined L-System rule set"

[parameters.iterations]
type = "int"
default = 4
min = 1
max = 7
description = "Number of rewriting generations (higher = more detail, exponential growth)"

[parameters.angle]
type = "float"
default = 25.0
min = 1.0
max = 180.0
step = 1.0
description = "Turning angle in degrees for + and - commands"

[parameters.segment_length]
type = "float"
default = 1.0
min = 0.1
max = 5.0
step = 0.1
description = "Length of each forward step"

[parameters.length_decay]
type = "float"
default = 1.0
min = 0.3
max = 1.0
step = 0.05
description = "Length multiplier per bracket depth (< 1.0 shrinks branches)"

[parameters.line_color]
type = "color"
default = [0.4, 0.8, 0.3, 1.0]
description = "Color of the generated lines"

[parameters.seed_value]
type = "int"
default = 0
min = 0
max = 9999
description = "Random seed (reserved for stochastic L-Systems)"

[output]
type = "Resource"
format = "tres"
base_path = "res://library/lsystem/"
